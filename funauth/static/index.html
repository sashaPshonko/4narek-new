<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FunAuth — пул аккаунтов</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --warn: #f5a524;
      --bad: #f31260;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 960px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card h2 {
      font-size: 0.95rem;
      margin: 0 0 12px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 1px solid var(--accent); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.danger { background: var(--bad); }
    .msg {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--bad); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .badge.ready { background: #163527; color: var(--ok); }
    .badge.full { background: #3a2810; color: var(--warn); }
    .badge.off { background: #2a2030; color: var(--bad); }
    .full-width { grid-column: 1 / -1; }
    #health { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>FunAuth</h1>
  <p class="sub">Пул Telegram-аккаунтов для привязки Minecraft через @FunAuthBot</p>
  <div id="health">Загрузка…</div>

  <div class="grid">
    <div class="card">
      <h2>Добавить аккаунт</h2>
      <label>Телефон (+7…)</label>
      <input id="phone" type="tel" placeholder="+79001234567" autocomplete="tel" />
      <div class="row">
        <button id="btnStart" type="button">Отправить код</button>
      </div>

      <label style="margin-top:14px">Код из Telegram</label>
      <input id="code" type="text" placeholder="12345" inputmode="numeric" />
      <div class="row">
        <button id="btnCode" type="button" disabled>Подтвердить код</button>
      </div>

      <label style="margin-top:14px">Облачный пароль (2FA), если нужен</label>
      <input id="tgPassword" type="password" placeholder="пароль 2FA" />
      <div class="row">
        <button id="btnPassword" type="button" disabled>Войти с паролем</button>
      </div>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Очередь / тест bind</h2>
      <label>Ник Minecraft</label>
      <input id="nick" type="text" placeholder="Player123" />
      <label>Пароль аккаунта</label>
      <input id="mcPassword" type="password" placeholder="пароль" />
      <div class="row">
        <button id="btnBind" type="button">Привязать</button>
        <button id="btnRefresh" class="ghost" type="button">Обновить</button>
      </div>
      <div id="bindMsg" class="msg"></div>
      <div id="queueInfo" class="msg" style="margin-top:12px"></div>
    </div>

    <div class="card full-width">
      <h2>Аккаунты</h2>
      <div id="accounts"><p class="msg">Нет аккаунтов</p></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentPhone = '';

    function setMsg(el, text, kind) {
      el.textContent = text || '';
      el.className = 'msg' + (kind ? ' ' + kind : '');
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && !data.error) data.error = res.statusText;
      return data;
    }

    async function refresh() {
      const [health, accounts, queue] = await Promise.all([
        api('/api/health'),
        api('/api/accounts'),
        api('/api/queue'),
      ]);
      $('health').textContent =
        `аккаунтов: ${health.accounts ?? '—'} · готовых: ${health.ready ?? '—'} · в очереди: ${health.queue ?? 0}`;

      if (!Array.isArray(accounts) || !accounts.length) {
        $('accounts').innerHTML = '<p class="msg">Нет аккаунтов</p>';
      } else {
        $('accounts').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Телефон</th>
                <th>Username</th>
                <th>Статус</th>
                <th>/start</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${accounts.map((a) => `
                <tr>
                  <td>${esc(a.phone)}</td>
                  <td>${esc(a.username ? '@' + a.username : '—')}</td>
                  <td>${badge(a)}</td>
                  <td>${a.started ? 'да' : 'нет'}</td>
                  <td><button class="danger" data-del="${esc(a.id)}" type="button">Удалить</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
        $('accounts').querySelectorAll('[data-del]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Удалить аккаунт?')) return;
            await api('/api/accounts/' + btn.dataset.del, { method: 'DELETE' });
            refresh();
          });
        });
      }

      const q = queue || {};
      const lines = [];
      if (q.current) lines.push('сейчас: ' + q.current.nick);
      if (q.pending?.length) {
        lines.push('ожидают: ' + q.pending.map((j) => j.nick).join(', '));
      }
      if (!lines.length) lines.push('очередь пуста');
      $('queueInfo').textContent = lines.join('\n');
    }

    function badge(a) {
      if (a.full) return '<span class="badge full">полный</span>';
      if (a.ready) return '<span class="badge ready">готов</span>';
      return '<span class="badge off">офлайн</span>';
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    $('btnStart').onclick = async () => {
      const phone = $('phone').value.trim();
      setMsg($('loginMsg'), 'Отправка кода…');
      $('btnStart').disabled = true;
      try {
        const r = await api('/api/login/start', {
          method: 'POST',
          body: JSON.stringify({ phone }),
        });
        if (r.error && !r.ok) throw new Error(r.error);
        currentPhone = r.phone || phone;
        $('btnCode').disabled = false;
        setMsg($('loginMsg'), 'Код отправлен на ' + currentPhone, 'ok');
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      } finally {
        $('btnStart').disabled = false;
      }
    };

    $('btnCode').onclick = async () => {
      const phone = currentPhone || $('phone').value.trim();
      const code = $('code').value.trim();
      setMsg($('loginMsg'), 'Проверка кода…');
      try {
        const r = await api('/api/login/code', {
          method: 'POST',
          body: JSON.stringify({ phone, code }),
        });
        if (r.error && r.ok === false) throw new Error(r.error);
        if (r.needPassword) {
          $('btnPassword').disabled = false;
          setMsg($('loginMsg'), 'Нужен облачный пароль 2FA', 'ok');
          return;
        }
        setMsg($('loginMsg'), 'Аккаунт добавлен: ' + (r.phone || phone), 'ok');
        $('btnCode').disabled = true;
        $('btnPassword').disabled = true;
        refresh();
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      }
    };

    $('btnPassword').onclick = async () => {
      const phone = currentPhone || $('phone').value.trim();
      const password = $('tgPassword').value;
      setMsg($('loginMsg'), 'Проверка пароля…');
      try {
        const r = await api('/api/login/password', {
          method: 'POST',
          body: JSON.stringify({ phone, password }),
        });
        if (r.error && r.ok === false) throw new Error(r.error);
        setMsg($('loginMsg'), 'Аккаунт добавлен: ' + (r.phone || phone), 'ok');
        $('btnCode').disabled = true;
        $('btnPassword').disabled = true;
        refresh();
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      }
    };

    $('btnBind').onclick = async () => {
      const nick = $('nick').value.trim();
      const password = $('mcPassword').value;
      setMsg($('bindMsg'), 'В очереди, ждём…');
      $('btnBind').disabled = true;
      try {
        const r = await api('/api/bind', {
          method: 'POST',
          body: JSON.stringify({ nick, password }),
        });
        if (r.ok) {
          setMsg(
            $('bindMsg'),
            `OK · ${r.nick}` + (r.tgPhone ? ` · TG ${r.tgPhone}` : '') +
              (r.reply ? `\n${r.reply}` : ''),
            'ok',
          );
        } else {
          setMsg(
            $('bindMsg'),
            `Ошибка: ${r.error || 'unknown'}` +
              (r.tgPhone ? ` · TG ${r.tgPhone}` : '') +
              (r.reply ? `\n${r.reply}` : ''),
            'err',
          );
        }
        refresh();
      } catch (e) {
        setMsg($('bindMsg'), String(e.message || e), 'err');
      } finally {
        $('btnBind').disabled = false;
      }
    };

    $('btnRefresh').onclick = () => refresh();
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
