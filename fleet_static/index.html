<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4narek · Флот</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eceff3;
      --ink: #0c1222;
      --muted: #5b6578;
      --faint: #8b94a5;
      --line: rgba(12,18,34,.1);
      --ban: #b91c1c;
      --ban-bg: rgba(185,28,28,.08);
      --ok: #047857;
      --ok-bg: rgba(4,120,87,.08);
      --warn: #b45309;
      --warn-bg: rgba(180,83,9,.1);
      --surface: #fff;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); font-family: var(--font);
      background: radial-gradient(800px 400px at 10% -10%, #f4d6d6 0%, transparent 50%),
                  linear-gradient(180deg, #f0f2f5, #e4e8ee);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-family: var(--display); font-size: clamp(32px, 6vw, 48px); margin: 0 0 6px; letter-spacing: -.04em; }
    h1 span { color: var(--ban); }
    .lede { color: var(--muted); margin: 0 0 18px; max-width: 36em; }
    .status {
      display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      font-size: 13px; color: var(--muted); margin-bottom: 18px;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .status.err .dot { background: var(--ban); }
    .kpi {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px;
    }
    .lookup-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .lookup-row input {
      font: inherit; font-family: var(--mono); font-size: 14px; padding: 8px 12px;
      border-radius: 10px; border: 1px solid var(--line); min-width: 220px; flex: 1;
    }
    #ipResult { margin-top: 10px; font-size: 14px; }
    #ipResult.ban { color: var(--ban); font-weight: 600; }
    #ipResult.ok { color: var(--ok); font-weight: 600; }
    #ipResult.muted { color: var(--muted); }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 16px; box-shadow: 0 10px 30px rgba(12,18,34,.04);
    }
    .card .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font-family: var(--mono); font-size: 28px; font-weight: 600; margin-top: 4px; }
    .card .v.ban { color: var(--ban); }
    .nav { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
      padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    }
    .nav a:hover { color: var(--ink); }
    .nav a.active { color: var(--ink); border-color: rgba(185,28,28,.35); background: var(--ban-bg); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .btn {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink);
    }
    .btn:hover { border-color: rgba(12,18,34,.2); }
    .btn.ok { border-color: rgba(4,120,87,.35); color: var(--ok); }
    .toast {
      font-size: 12px; color: var(--ok); font-weight: 600; opacity: 0; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .toast.err { color: var(--ban); }
    .section-title {
      font-family: var(--display); font-size: 20px; margin: 28px 0 10px; letter-spacing: -.02em;
    }
    .anarchy {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      margin-bottom: 12px; overflow: hidden;
    }
    .anarchy > header {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--ban-bg);
    }
    .anarchy.owners > header { background: #eef2ff; }
    .anarchy > header h2 { margin: 0; font-size: 16px; font-family: var(--display); }
    .anarchy > header .cnt { font-family: var(--mono); color: var(--ban); font-weight: 600; }
    .anarchy.owners > header .cnt { color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    .nick { font-family: var(--display); font-weight: 700; }
    .meta { color: var(--faint); font-size: 12px; margin-top: 2px; }
    .mono { font-family: var(--mono); }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
    .reason { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
    .pill {
      display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
    }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .pill.banned { background: var(--ban-bg); color: var(--ban); }
    .pill.pending { background: #e8edf5; color: var(--muted); }
    .pill.error { background: var(--warn-bg); color: var(--warn); }
    .src-persisted { color: var(--faint); font-size: 11px; }
    @media (max-width: 640px) { .kpi { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>4narek <span>Баны</span></h1>
    <p class="lede">Баны ников: владельцы кланов и бай-боты.</p>
    <nav class="nav" aria-label="Разделы">
      <a href="/sales/" data-nav="sales">Продажи</a>
      <a href="/funauth/" data-nav="funauth">FunAuth</a>
      <a href="/fleet/" data-nav="fleet">Баны</a>
    </nav>
    <div class="toolbar">
      <button type="button" class="btn" id="copyBots">Скопировать ботов</button>
      <button type="button" class="btn" id="copyAll">Скопировать всё</button>
      <span class="toast" id="copyToast">скопировано</span>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">подключение…</span></div>
    <div class="kpi">
      <div class="card"><div class="k">Забанено сейчас</div><div class="v ban mono" id="kpiTotal">—</div></div>
      <div class="card"><div class="k">Анархии с банами</div><div class="v mono" id="kpiAn">—</div></div>
      <div class="card"><div class="k">Владельцы кланов</div><div class="v mono" id="kpiOwners">—</div></div>
    </div>
    <h2 class="section-title">Владельцы кланов</h2>
    <div id="owners"></div>
    <h2 class="section-title">Баны ботов</h2>
    <div id="list"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let lastOverview = null;
    const seenBanKeys = new Set(JSON.parse(localStorage.getItem("fleetSeenBans") || "[]"));

    document.querySelectorAll(".nav a").forEach((a) => {
      if (location.pathname.startsWith("/" + a.dataset.nav)) a.classList.add("active");
    });

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().catch(() => {});
    }

    const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtWhen = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return escapeHtml(iso);
      return d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    };
    const statusLabel = (s) => ({
      ok: "ок",
      banned: "бан",
      pending: "ждём пинг",
      error: "ошибка",
    })[s] || s || "?";

    const banKey = (b) => `${String(b.username || "").toLowerCase()}|${b.anarchy ?? "?"}`;

    function formatBotLine(b) {
      const an = b.anarchy ?? "?";
      const type = b.go_type || "—";
      const when = b.banned_at || "—";
      const reason = (b.reason || "—").replace(/\s+/g, " ");
      const src = b.source === "persisted" ? " [persisted]" : "";
      return `an${an}\t${b.username}\t${type}\t${when}\t${reason}${src}`;
    }

    function formatOwnerLine(o) {
      const st = o.banned || o.status === "banned" ? "BAN" : (o.status || "?").toUpperCase();
      return `an${o.anarchy ?? "?"}\t${o.username}\tclan_owner\t${st}\t${o.checked_at || o.banned_at || "—"}\t${(o.reason || "—").replace(/\s+/g, " ")}`;
    }

    function showCopyToast(msg, isErr = false) {
      const t = $("copyToast");
      t.textContent = msg;
      t.classList.toggle("err", isErr);
      t.classList.add("show");
      setTimeout(() => {
        t.classList.remove("show");
        t.classList.remove("err");
        t.textContent = "скопировано";
      }, 1800);
    }

    async function copyText(text) {
      const value = String(text ?? "");
      try {
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const ta = document.createElement("textarea");
          ta.value = value;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "0";
          ta.style.width = "1px";
          ta.style.height = "1px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (!ok) throw new Error("execCommand failed");
        }
        showCopyToast("скопировано");
      } catch (e) {
        console.warn("copy failed:", e);
        showCopyToast("не удалось скопировать", true);
      }
    }

    function notifyNewBans(data) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      for (const b of data.banned || []) {
        const key = banKey(b);
        if (seenBanKeys.has(key)) continue;
        seenBanKeys.add(key);
        new Notification("4narek · бан бота", {
          body: `${b.username} · an${b.anarchy ?? "?"}`,
          tag: key,
        });
      }
      for (const o of data.clan_owners || []) {
        if (!o.banned && o.status !== "banned") continue;
        const key = `owner|${banKey(o)}`;
        if (seenBanKeys.has(key)) continue;
        seenBanKeys.add(key);
        new Notification("4narek · бан владельца", {
          body: `${o.username} · an${o.anarchy ?? "?"}`,
          tag: key,
        });
      }
      localStorage.setItem("fleetSeenBans", JSON.stringify([...seenBanKeys]));
    }

    $("copyBots").addEventListener("click", async () => {
      if (!lastOverview?.banned?.length) {
        showCopyToast("список ботов пуст", true);
        return;
      }
      await copyText(lastOverview.banned.map(formatBotLine).join("\n"));
    });
    $("copyAll").addEventListener("click", async () => {
      if (!lastOverview) {
        showCopyToast("данные ещё не загрузились", true);
        return;
      }
      const lines = [];
      for (const b of lastOverview.banned || []) lines.push(formatBotLine(b));
      for (const o of lastOverview.clan_owners || []) {
        if (o.banned || o.status === "banned") lines.push(formatOwnerLine(o));
      }
      if (!lines.length) {
        showCopyToast("нечего копировать", true);
        return;
      }
      await copyText(lines.join("\n"));
    });

    async function load() {
      try {
        const res = await fetch("/fleet/api/overview", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        lastOverview = data;
        notifyNewBans(data);
        $("status").classList.remove("err");
        const t = new Date(data.updated_at);
        const owners = data.clan_owners || [];
        const ownersBanned = owners.filter((o) => o.banned || o.status === "banned").length;
        $("statusText").textContent = `обновлено ${t.toLocaleTimeString("ru-RU")} · ${data.total_banned} бан(ов) · в памяти ${data.persisted_banned ?? 0} · владельцев ${owners.length}`;
        $("kpiTotal").textContent = data.total_banned;
        $("kpiAn").textContent = (data.anarchies || []).filter((a) => a.count > 0).length;
        $("kpiOwners").textContent = owners.length ? `${ownersBanned}/${owners.length}` : "—";

        const ownersEl = $("owners");
        if (!owners.length) {
          ownersEl.innerHTML = `<div class="anarchy owners"><div class="empty">Владельцы ещё не пришли в presence.<br/>Рестартни оркестраторы после pull — через ~5с появятся.</div></div>`;
        } else {
          const rows = owners.map((o) => `
            <tr>
              <td>
                <div class="nick">${escapeHtml(o.username)}</div>
                <div class="meta">an${escapeHtml(o.anarchy ?? "?")} · владелец клана${o.ip ? " · " + escapeHtml(o.ip) : ""}</div>
              </td>
              <td><span class="pill ${escapeHtml(o.status || "pending")}">${escapeHtml(statusLabel(o.status))}</span></td>
              <td class="mono">${fmtWhen(o.checked_at || o.banned_at)}</td>
              <td><div class="reason" title="${escapeHtml(o.reason || "")}">${escapeHtml(o.reason || "—")}</div></td>
            </tr>`).join("");
          ownersEl.innerHTML = `<section class="anarchy owners">
            <header><h2>Все анки</h2><span class="cnt">${owners.length}</span></header>
            <table>
              <thead><tr><th>Ник</th><th>Статус</th><th>Проверка</th><th>Детали</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </section>`;
        }

        const list = $("list");
        if (!data.total_banned) {
          list.innerHTML = `<div class="anarchy"><div class="empty">Сейчас никто из бай-ботов не помечен забаненным.</div></div>`;
          return;
        }
        list.innerHTML = (data.anarchies || []).map((a) => {
          const title = a.anarchy ? `Анархия ${a.anarchy}` : "Без анархии";
          const rows = (a.banned || []).map((b) => {
            const type = b.go_type || "—";
            const persisted = b.source === "persisted" ? `<div class="src-persisted">из памяти сервера</div>` : "";
            return `
            <tr>
              <td>
                <div class="nick">${escapeHtml(b.username)}</div>
                <div class="meta">${escapeHtml(type)}${b.ip ? " · " + escapeHtml(b.ip) : ""}</div>
                ${persisted}
              </td>
              <td class="mono">${fmtWhen(b.banned_at)}</td>
              <td><div class="reason" title="${escapeHtml(b.reason || "")}">${escapeHtml(b.reason || "—")}</div></td>
            </tr>`;
          }).join("");
          return `<section class="anarchy">
            <header><h2>${title}</h2><span class="cnt">${a.count}</span></header>
            <table>
              <thead><tr><th>Бот</th><th>Когда</th><th>Причина</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </section>`;
        }).join("");
      } catch (e) {
        $("status").classList.add("err");
        $("statusText").textContent = "нет связи: " + e.message;
      }
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
