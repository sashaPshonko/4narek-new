<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4narek · Решения по ценам</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1ef;
      --ink: #111a15;
      --muted: #5d6c64;
      --faint: #8a998f;
      --line: rgba(17, 26, 21, .12);
      --surface: #ffffff;

      --ok: #15803d;
      --ok-bg: #e8f6ec;
      --ok-line: #9ad3ab;
      --bad: #b91c1c;
      --bad-bg: #fdecec;
      --bad-line: #eeb0b0;
      --warn: #b45309;

      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font-family: var(--font); background: var(--bg); line-height: 1.35; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }

    .brand { font-family: var(--display); font-weight: 800; margin: 0 0 6px; font-size: 32px; letter-spacing: -.03em; }
    .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .nav a { text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
    .nav a.active, .nav a:hover { color: var(--ink); border-color: #aab7af; }

    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); position: sticky; top: 6px; z-index: 20; }
    .bar select, .bar button { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; color: var(--ink); }
    .bar button { cursor: pointer; font-weight: 700; }
    .bar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); cursor: pointer; padding: 0 4px; }
    .chk input { width: 16px; height: 16px; }
    .meta { margin-left: auto; color: var(--faint); font-size: 12.5px; font-family: var(--mono); }

    /* сводка + легенда */
    .summary { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin-bottom: 14px; }
    .sum { display: flex; align-items: baseline; gap: 10px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
    .sum .num { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -.02em; line-height: 1; }
    .sum .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
    .sum.ok { background: var(--ok-bg); border-color: var(--ok-line); } .sum.ok .num { color: var(--ok); }
    .sum.bad { background: var(--bad-bg); border-color: var(--bad-line); } .sum.bad .num { color: var(--bad); }
    .sum.mv .num { font-size: 20px; }
    .legend { margin-left: auto; align-self: center; font-size: 12.5px; color: var(--muted); max-width: 520px; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin: 0 4px 0 8px; vertical-align: -1px; }
    .legend i.g { background: var(--ok); } .legend i.r { background: var(--bad); }

    /* лента */
    .feed { display: flex; flex-direction: column; gap: 6px; }
    .grp { margin: 14px 0 2px; padding: 0 4px; display: flex; align-items: baseline; gap: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .grp b { font-size: 17px; color: var(--ink); font-family: var(--display); letter-spacing: -.01em; }
    .grp .okc { color: var(--ok); font-weight: 700; } .grp .badc { color: var(--bad); font-weight: 700; }

    .row {
      display: grid; align-items: center; gap: 8px 18px;
      grid-template-columns: 150px 190px minmax(280px, 1fr) minmax(300px, 1.1fr);
      padding: 10px 14px 10px 12px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--faint);
    }
    .row.ok { border-left-color: var(--ok); background: linear-gradient(90deg, var(--ok-bg), #fff 38%); }
    .row.bad { border-left-color: var(--bad); background: linear-gradient(90deg, var(--bad-bg), #fff 38%); }

    .who .name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .sub { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 2px; }

    .move { display: flex; flex-direction: column; gap: 2px; }
    .move .line { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); }
    .move .from { font-family: var(--mono); font-size: 13px; color: var(--faint); }
    .move .to { font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1; }
    .move .ar { color: var(--faint); font-size: 14px; }
    .move .delta { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--muted); }
    .move .delta.up { color: #0f6f68; } .move .delta.down { color: #a3470f; }
    .move .reason { font-size: 12.5px; color: var(--muted); }

    /* шкала пол — цена — потолок */
    .scale { position: relative; padding-top: 6px; }
    .scale .track { position: relative; height: 10px; border-radius: 6px; background: #dbe3de; }
    .scale .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: #a9bdb2; }
    .scale .mark { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
    .scale .mark.out { background: var(--bad); }
    .scale .prev { position: absolute; top: -1px; width: 2px; height: 12px; margin-left: -1px; background: #6b7d73; opacity: .55; }
    .scale .lbls { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 12.5px; }
    .scale .lbls span b { font-weight: 700; color: var(--ink); }
    .scale .lbls span { color: var(--muted); }
    .scale .pos { font-size: 12px; color: var(--muted); font-family: var(--mono); text-align: center; flex: 1; }
    .scale .pos.out { color: var(--bad); font-weight: 700; }
    .noscale { font-family: var(--mono); font-size: 12.5px; color: var(--faint); }

    .nums { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 13px; }
    .nums .c { display: inline-flex; flex-direction: column; min-width: 54px; }
    .nums .c .k { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
    .nums .c .v { font-weight: 700; font-size: 15px; }
    .nums .c.sales .v { font-size: 19px; font-family: var(--display); }
    .nums .c.sales.ok .v { color: var(--ok); } .nums .c.sales.bad .v { color: var(--bad); }
    .nums .c .v.warn { color: var(--warn); }

    .empty { text-align: center; color: var(--muted); padding: 40px 12px; background: var(--surface); border-radius: 12px; border: 1px dashed var(--line); }

    @media (max-width: 1150px) {
      .row { grid-template-columns: 130px 1fr; }
      .scale, .nums { grid-column: 1 / -1; }
    }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .meta { width: 100%; margin-left: 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">Решения по ценам</h1>
    <nav class="nav">
      <a href="/pricing/" class="active">Цены</a>
      <a href="/sales/">Продажи</a>
      <a href="/funauth/">FunAuth</a>
      <a href="/autosell/">Автопродажа</a>
      <a href="/fleet/">Баны</a>
    </nav>

    <div class="bar">
      <select id="period" title="Период">
        <option value="1h">Час</option>
        <option value="3h" selected>3 часа</option>
        <option value="6h">6 часов</option>
        <option value="24h">Сутки</option>
        <option value="7d">7 дней</option>
        <option value="all">Всё</option>
      </select>
      <select id="category" title="Категория"><option value="">Все категории</option></select>
      <select id="item" title="Предмет"><option value="">Все предметы</option></select>
      <select id="norm" title="Норма продаж">
        <option value="">Любые</option>
        <option value="ok">Норма выполнена</option>
        <option value="bad">Норма не выполнена</option>
      </select>
      <select id="dir" title="Что сделала цена">
        <option value="">Любое движение</option>
        <option value="UP">Цена выросла</option>
        <option value="DOWN">Цена упала</option>
        <option value="HOLD">Цена не изменилась</option>
      </select>
      <label class="chk" title="Строки, где нет ни запаса, ни продаж, ни попыток"><input type="checkbox" id="showIdle" /> показывать пустые</label>
      <button type="button" class="primary" id="refresh">Обновить</button>
      <span class="meta" id="meta">…</span>
    </div>

    <div class="summary" id="summary"></div>

    <div class="feed" id="feed"><div class="empty">Загрузка…</div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));

    const SHORT = {
      "megasword-1.21": "mega", "megasword-яд3-1.21": "яд3", "pochti-megasword-1.21": "почти",
      "sword7-1.21": "sword7", "sword-sharp5-1.21": "остр5", "sword-sharp6-1.21": "остр6",
    };
    const shortName = (id) => SHORT[id] || String(id || "").replace(/-1\.21$/, "");

    const fmt = (n) => {
      if (n == null || Number.isNaN(+n) || +n === 0) return "—";
      const x = Math.round(Number(n));
      if (Math.abs(x) >= 1_000_000) return (x / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
      if (Math.abs(x) >= 1_000) return Math.round(x / 1e3) + "k";
      return String(x);
    };
    const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
    const clock = (iso) => {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    };
    const hm = (iso) => {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    };

    function categoryOf(id) {
      if (id.includes("helmet") || id.startsWith("шлем")) return "helmet";
      if (id.includes("chestplate") || id.startsWith("нагрудник")) return "chestplate";
      if (id.includes("leggings") || id.startsWith("штаны")) return "leggings";
      if (id.includes("boots") || id.startsWith("ботинки")) return "boots";
      if (id.includes("sword") || id.includes("mega") || id.includes("остр") || id.includes("яд") || id.includes("почти")) return "sword";
      if (id.includes("pickaxe") || id.startsWith("кирка")) return "pickaxe";
      return "";
    }

    // пустая строка: нет запаса (АХ, инвентарь), нет продаж и попыток за цикл — по ней нечего смотреть
    const isIdle = (d) => !(d.held || 0) && !(d.on_ah || 0) && !(d.inv || 0) && !(d.sales || 0) && !(d.try_sells || 0);

    // норма выполнена = продажи за цикл не меньше нормы N
    const normOk = (d) => (d.normal_sales > 0) && (d.sales >= d.normal_sales);

    function scaleHTML(d) {
      const floor = d.price_floor || 0, ceil = d.price_ceil || 0, p = d.price_after || 0, p0 = d.price_before || 0;
      if (!floor && !ceil) return `<div class="noscale">пол и потолок в записи не сохранены</div>`;
      if (!ceil) {
        return `<div class="scale"><div class="lbls"><span>пол <b>${fmt(floor)}</b></span><span class="pos">цена <b>${fmt(p)}</b></span><span>потолка в записи нет</span></div></div>`;
      }
      const lo = Math.min(floor || ceil, ceil), hi = Math.max(floor || ceil, ceil);
      const span = Math.max(hi - lo, 1);
      const pos = (v) => Math.max(0, Math.min(100, ((v - lo) / span) * 100));
      const above = p > hi, below = p < lo;
      const state = above ? "выше потолка" : below ? "ниже пола" : `${Math.round(pos(p))}% от пола к потолку`;
      return `<div class="scale">
        <div class="track">
          <div class="fill" style="width:${pos(p)}%"></div>
          ${p0 && p0 !== p ? `<div class="prev" style="left:${pos(p0)}%" title="было ${fmt(p0)}"></div>` : ""}
          <div class="mark ${above || below ? "out" : ""}" style="left:${pos(p)}%"></div>
        </div>
        <div class="lbls">
          <span>пол <b>${fmt(floor)}</b></span>
          <span class="pos ${above || below ? "out" : ""}">цена <b>${fmt(p)}</b> · ${state}</span>
          <span>потолок <b>${fmt(ceil)}</b></span>
        </div>
      </div>`;
    }

    function rowHTML(d) {
      const ok = normOk(d);
      const delta = d.delta != null ? d.delta : (d.price_after - d.price_before);
      const cls = delta > 0 ? "up" : delta < 0 ? "down" : "";
      const arrow = delta > 0 ? "↑" : delta < 0 ? "↓" : "→";
      const trys = d.try_sells ?? 0, s = d.sales ?? 0;
      const tryWarn = trys > Math.max(s, 1) * 7;
      return `<div class="row ${ok ? "ok" : "bad"}" data-id="${esc(d.item)}">
        <div class="who">
          <div class="name" title="${esc(d.item)}">${esc(shortName(d.item))}</div>
          <div class="sub">${hm(d.ts)} · нац ${fmt(d.nacenka_after)} · шаг ${fmt(d.step)}</div>
        </div>
        <div class="move">
          <div class="line"><span class="from">${fmt(d.price_before)}</span><span class="ar">${arrow}</span><span class="to">${fmt(d.price_after)}</span></div>
          <div class="delta ${cls}">${delta ? signed(delta) : "цена не изменилась"}</div>
        </div>
        ${scaleHTML(d)}
        <div>
          <div class="nums">
            <div class="c sales ${ok ? "ok" : "bad"}"><span class="k">продаж / норма</span><span class="v">${s}/${d.normal_sales || "—"}</span></div>
            <div class="c"><span class="k">попыток</span><span class="v ${tryWarn ? "warn" : ""}">${trys}</span></div>
            <div class="c"><span class="k">куплено</span><span class="v">${d.buys ?? 0}</span></div>
            <div class="c"><span class="k">на АХ</span><span class="v">${d.on_ah ?? 0}</span></div>
            <div class="c"><span class="k">в инв.</span><span class="v">${d.inv ?? 0}</span></div>
            <div class="c"><span class="k">всего</span><span class="v">${d.held ?? 0}</span></div>
          </div>
          <div class="move"><div class="reason">${esc(d.reason_ru || d.action || "")}</div></div>
        </div>
      </div>`;
    }

    function renderSummary(list) {
      const ok = list.filter(normOk).length, bad = list.length - ok;
      const ups = list.filter((d) => (d.delta || 0) > 0).length, downs = list.filter((d) => (d.delta || 0) < 0).length;
      $("summary").innerHTML = `
        <div class="sum ok"><span class="num">${ok}</span><span class="lab">норма выполнена</span></div>
        <div class="sum bad"><span class="num">${bad}</span><span class="lab">норма не выполнена</span></div>
        <div class="sum mv"><span class="num">${ups}</span><span class="lab">цена выросла</span></div>
        <div class="sum mv"><span class="num">${downs}</span><span class="lab">цена упала</span></div>
        <div class="legend">Цвет строки — только про норму: <i class="g"></i>продажи за цикл ≥ нормы, <i class="r"></i>продажи ниже нормы. Тёмная метка на шкале — цена после решения, тонкая серая — цена до него.</div>`;
    }

    function renderFeed(list) {
      if (!list.length) { $("feed").innerHTML = `<div class="empty">Нет решений по предметам с запасом, продажами или попытками (пустые скрыты, галочка «показывать пустые» в панели)</div>`; return; }
      let html = "", cur = "", bucket = [];
      const flush = () => {
        if (!bucket.length) return;
        bucket.sort((a, b) => (b.held || 0) - (a.held || 0) || (b.sales || 0) - (a.sales || 0) || String(a.item).localeCompare(String(b.item)));
        const ok = bucket.filter(normOk).length;
        html += `<div class="grp"><b>${cur}</b><span>${bucket.length} решений</span><span class="okc">${ok} норма</span><span class="badc">${bucket.length - ok} не норма</span></div>` + bucket.map(rowHTML).join("");
        bucket = [];
      };
      for (const d of list) {
        const key = clock(d.ts);
        if (key !== cur) { flush(); cur = key; }
        bucket.push(d);
      }
      flush();
      $("feed").innerHTML = html;
    }

    async function fillItems() {
      const res = await fetch("/pricing/api/items", { cache: "no-store" });
      const data = await res.json();
      const sel = $("item"), keep = sel.value;
      sel.innerHTML = `<option value="">Все предметы</option>`;
      (data.items || []).sort().forEach((id) => {
        const o = document.createElement("option");
        o.value = id; o.textContent = shortName(id) + " · " + id; sel.appendChild(o);
      });
      if (keep) sel.value = keep;
      const cats = new Set();
      for (const id of (data.items || [])) { const c = categoryOf(id); if (c) cats.add(c); }
      const csel = $("category"), ckeep = csel.value;
      csel.innerHTML = `<option value="">Все категории</option>`;
      Array.from(cats).sort().forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c; csel.appendChild(o); });
      if (ckeep) csel.value = ckeep;
    }

    async function load() {
      const q = new URLSearchParams({ period: $("period").value, limit: "400" });
      if ($("item").value) q.set("item", $("item").value);
      if ($("dir").value) q.set("dir", $("dir").value);
      $("meta").textContent = "загрузка…";
      try {
        const res = await fetch("/pricing/api/board?" + q.toString(), { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error("bad response");
        let list = data.decisions || [];
        const cat = $("category").value, norm = $("norm").value;
        if (cat) list = list.filter((d) => categoryOf(d.item) === cat);
        if (norm === "ok") list = list.filter(normOk);
        if (norm === "bad") list = list.filter((d) => !normOk(d));
        const total = list.length;
        if (!$("showIdle").checked) list = list.filter((d) => !isIdle(d));
        const hidden = total - list.length;
        $("meta").textContent = `${clock(data.updated_at)} · решений ${list.length}` + (hidden ? ` · скрыто пустых ${hidden}` : "");
        renderSummary(list);
        renderFeed(list);
      } catch (e) {
        $("feed").innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
        $("summary").innerHTML = "";
        $("meta").textContent = "ошибка";
      }
    }

    $("refresh").onclick = load;
    ["period", "category", "item", "norm", "dir", "showIdle"].forEach((id) => { $(id).onchange = load; });
    $("feed").onclick = (e) => {
      const row = e.target.closest(".row[data-id]");
      if (!row) return;
      const id = row.getAttribute("data-id");
      $("item").value = $("item").value === id ? "" : id;
      load();
    };
    fillItems().then(load);
    setInterval(load, 20000);
  </script>
</body>
</html>
