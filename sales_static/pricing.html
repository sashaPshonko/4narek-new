<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4narek · Ценообразование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #d8e2dc;
      --ink: #142018;
      --muted: #5a6b62;
      --faint: #84948c;
      --line: rgba(20, 32, 24, 0.1);
      --bubble: #f7faf8;
      --bubble-edge: rgba(20,32,24,.08);
      --up: #0f766e;
      --down: #c2410c;
      --hold: #64748b;
      --warn: #a16207;
      --ok: #15803d;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font);
      background:
        radial-gradient(800px 380px at 8% -8%, rgba(15,118,110,.18), transparent 55%),
        linear-gradient(165deg, #eef3ef 0%, var(--bg) 45%, #cfdcd3 100%);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 72px; }
    .brand { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.03em; margin: 0 0 8px; }
    .brand span { color: var(--up); }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .nav a {
      text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
      padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.55);
    }
    .nav a.active, .nav a:hover { color: var(--ink); background: #fff; }
    .lede { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;
      padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line);
      position: sticky; top: 8px; z-index: 5; backdrop-filter: blur(10px);
    }
    .bar select, .bar button {
      font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff;
    }
    .bar button { cursor: pointer; font-weight: 600; }
    .meta { margin-left: auto; color: var(--faint); font-size: 12px; font-family: var(--mono); }
    .feed { display: flex; flex-direction: column; gap: 12px; }
    .msg {
      background: var(--bubble);
      border: 1px solid var(--bubble-edge);
      border-radius: 18px 18px 18px 6px;
      padding: 14px 16px 12px;
      box-shadow: 0 10px 28px rgba(20,32,24,.06);
      animation: rise .3s ease both;
    }
    .msg.UP { border-left: 4px solid var(--up); }
    .msg.DOWN { border-left: 4px solid var(--down); }
    .msg.HOLD { border-left: 4px solid var(--hold); }
    .title {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 10px;
    }
    .title .name { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
    .title .status { font-size: 15px; }
    .title .clock { margin-left: auto; color: var(--faint); font-size: 12px; font-family: var(--mono); }
    .lines { display: grid; gap: 5px; font-size: 14px; line-height: 1.35; }
    .line { display: grid; grid-template-columns: 1.35fr 1.65fr; gap: 8px; align-items: baseline; }
    .line .lab { color: var(--muted); }
    .line .val { font-weight: 600; }
    .line .val.mono { font-family: var(--mono); font-weight: 500; font-size: 13px; }
    .line .val .hi { color: var(--up); }
    .line .val .lo { color: var(--down); }
    .line .val .warn { color: var(--warn); }
    .line .val .ok { color: var(--ok); }
    .decision {
      margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
      display: grid; gap: 6px;
    }
    .decision .mark {
      font-weight: 800; font-size: 14px;
    }
    .decision .mark.UP { color: var(--up); }
    .decision .mark.DOWN { color: var(--down); }
    .decision .mark.HOLD { color: var(--hold); }
    .decision code {
      font-family: var(--mono); font-size: 12px; background: rgba(20,32,24,.05);
      padding: 2px 7px; border-radius: 6px;
    }
    .decision .why {
      font-size: 13.5px; color: var(--ink); line-height: 1.4;
    }
    .decision .detail {
      font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.45;
      white-space: pre-wrap; word-break: break-word;
      background: rgba(20,32,24,.03); border-radius: 10px; padding: 8px 10px;
    }
    .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (max-width: 560px) {
      .line { grid-template-columns: 1fr; gap: 2px; }
      .title .clock { margin-left: 0; width: 100%; }
      .meta { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">4narek <span>Цены</span></h1>
    <nav class="nav" aria-label="Разделы">
      <a href="/pricing/" data-nav="pricing" class="active">Цены</a>
      <a href="/sales/" data-nav="sales">Продажи</a>
      <a href="/funauth/" data-nav="funauth">FunAuth</a>
      <a href="/fleet/" data-nav="fleet">Баны</a>
    </nav>
    <p class="lede">Те же cycle-логи, что раньше в Telegram — по одной карточке на решение.</p>

    <div class="bar">
      <select id="period">
        <option value="1h">Час</option>
        <option value="3h" selected>3 часа</option>
        <option value="6h">6 часов</option>
        <option value="24h">24 часа</option>
        <option value="7d">7 дней</option>
        <option value="all">Всё</option>
      </select>
      <select id="item"><option value="">Все предметы</option></select>
      <select id="dir">
        <option value="">Все</option>
        <option value="UP">↑ up</option>
        <option value="DOWN">↓ down</option>
        <option value="HOLD">hold</option>
      </select>
      <button type="button" id="refresh">Обновить</button>
      <span class="meta" id="meta">…</span>
    </div>

    <div class="feed" id="feed"><div class="empty">Загрузка…</div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (n) => {
      if (n == null || Number.isNaN(+n)) return "—";
      return Number(n).toLocaleString("ru-RU");
    };
    const clock = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return esc(iso);
      return d.toLocaleString("ru-RU", {
        day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
      });
    };

    function statusGlyph(d) {
      if (String(d.action || "").includes("skip")) return "⏸";
      if (d.sales < d.normal_sales) return "⚠️";
      return "✅";
    }
    function decisionGlyph(dir) {
      if (dir === "UP") return "📈";
      if (dir === "DOWN") return "📉";
      return "↔️";
    }
    function priceArrow(before, after) {
      if (after > before) return `<span class="hi">↑</span>`;
      if (after < before) return `<span class="lo">↓</span>`;
      return "→";
    }
    function salesClass(sales, norm) {
      if (sales >= norm) return "ok";
      if (sales === 0) return "warn";
      return "warn";
    }

    function line(lab, valHtml) {
      return `<div class="line"><span class="lab">${lab}</span><span class="val">${valHtml}</span></div>`;
    }

    function card(d) {
      const dir = d.dir || "HOLD";
      const nacSame = d.nacenka_before === d.nacenka_after;
      const nacHtml = nacSame
        ? `<span class="mono">${fmt(d.nacenka_after)}</span>`
        : `<span class="mono">${fmt(d.nacenka_before)} → ${fmt(d.nacenka_after)}</span>`;
      const priceHtml = `<span class="mono">${fmt(d.price_before)} → ${fmt(d.price_after)}</span> ${priceArrow(d.price_before, d.price_after)}`;
      const salesHtml = `<span class="${salesClass(d.sales, d.normal_sales)}">${d.sales}</span> из <b>${d.normal_sales}</b> (норма)`;
      const why = d.reason_ru || "";
      // notes often duplicates reason prefix — show full notes as detail
      const detail = d.notes || "";

      return `<article class="msg ${esc(dir)}">
        <div class="title">
          <span class="status">${statusGlyph(d)}</span>
          <span class="name">${esc(d.item)}</span>
          <span class="clock">${clock(d.ts)}</span>
        </div>
        <div class="lines">
          ${line("📦 Покупки", `<b>${d.buys}</b>`)}
          ${line("🛒 Попытки продаж", `<b>${d.try_sells}</b>`)}
          ${line("📊 Продажи", salesHtml)}
          ${line("💰 Цена", priceHtml)}
          ${line("🏷 Наценка", nacHtml)}
          ${line("🎒 АХ / инв / всего", `<span class="mono">${d.on_ah} | ${d.inv} | ${d.held}</span>`)}
          ${line("📐 Доля слотов", `<span class="mono">${d.share}</span> <span style="color:var(--faint)">(свободно ${d.free}, нужно ${d.need})</span>`)}
          ${line("🧱 Пол · step", `<span class="mono">${fmt(d.price_floor)} · ${fmt(d.step)}</span>`)}
          ${d.players_online ? line("👥 Онлайн", `<b>${d.players_online}</b>`) : ""}
        </div>
        <div class="decision">
          <div class="mark ${esc(dir)}">${decisionGlyph(dir)} Решение: <code>${esc(d.action)}</code></div>
          ${why ? `<div class="why">💬 ${esc(why)}</div>` : ""}
          ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
        </div>
      </article>`;
    }

    async function loadItems() {
      const res = await fetch("/pricing/api/items", { cache: "no-store" });
      const data = await res.json();
      const sel = $("item");
      const cur = sel.value;
      (data.items || []).sort().forEach((id) => {
        const o = document.createElement("option");
        o.value = id; o.textContent = id;
        sel.appendChild(o);
      });
      if (cur) sel.value = cur;
    }

    async function load() {
      const period = $("period").value;
      const item = $("item").value;
      const dir = $("dir").value;
      const q = new URLSearchParams({ period, limit: "100" });
      if (item) q.set("item", item);
      if (dir) q.set("dir", dir);
      $("meta").textContent = "…";
      try {
        const res = await fetch("/pricing/api/decisions?" + q.toString(), { cache: "no-store" });
        const data = await res.json();
        const list = data.decisions || [];
        $("meta").textContent = `${data.policy || "?"} · ${list.length}`;
        $("feed").innerHTML = list.length
          ? list.map(card).join("")
          : `<div class="empty">За период нет решений</div>`;
      } catch (e) {
        $("feed").innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
      }
    }

    $("refresh").onclick = load;
    $("period").onchange = load;
    $("item").onchange = load;
    $("dir").onchange = load;
    loadItems().then(load);
    setInterval(load, 30000);
  </script>
</body>
</html>
