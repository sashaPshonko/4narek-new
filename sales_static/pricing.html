<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4narek · Цены</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e6ebe8;
      --bg-deep: #d5ddd8;
      --ink: #101a14;
      --muted: #5a6b62;
      --faint: #84948c;
      --line: rgba(16, 26, 20, 0.12);
      --surface: #ffffff;
      --surface-soft: rgba(255,255,255,.72);

      --up: #0f766e;
      --up-bg: rgba(15,118,110,.14);
      --down: #c2410c;
      --down-bg: rgba(194,65,12,.12);
      --freeze: #1d4ed8;
      --freeze-bg: rgba(29,78,216,.12);
      --hold: #64748b;
      --hold-bg: rgba(100,116,139,.1);
      --manual: #a16207;
      --manual-bg: rgba(161,98,7,.12);
      --book: #7c3aed;
      --book-bg: rgba(124,58,237,.12);

      --shadow: 0 1px 0 rgba(255,255,255,.65) inset, 0 10px 28px rgba(16,26,20,.05);
      --radius: 14px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; color: var(--ink); font-family: var(--font); line-height: 1.4;
      background: linear-gradient(180deg, #eef3ef 0%, var(--bg) 42%, var(--bg-deep) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1520px; margin: 0 auto; padding: 24px 18px 60px; }

    .brand {
      font-family: var(--display); font-weight: 800; margin: 0 0 4px;
      font-size: clamp(28px, 4vw, 44px); letter-spacing: -.04em; line-height: .95;
    }
    .brand span { color: var(--up); }
    .lede { margin: 0 0 12px; color: var(--muted); max-width: 62em; font-size: 14px; }

    .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .nav a {
      text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    }
    .nav a.active, .nav a:hover { color: var(--ink); background: var(--up-bg); border-color: rgba(15,118,110,.28); }

    .bar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px;
      padding: 10px 12px; border-radius: 12px; background: var(--surface-soft);
      border: 1px solid var(--line); position: sticky; top: 6px; z-index: 20;
      backdrop-filter: blur(12px);
    }
    .bar select, .bar button {
      font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 12px; background: #fff; color: var(--ink);
    }
    .bar button { cursor: pointer; font-weight: 700; }
    .bar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip-clear {
      border: 1px dashed var(--line); background: transparent; border-radius: 999px;
      padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .chip-clear.on { color: var(--down); border-color: rgba(194,65,12,.35); background: var(--down-bg); }
    .meta { margin-left: auto; color: var(--faint); font-size: 12.5px; font-family: var(--mono); }

    .kpis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 16px; box-shadow: var(--shadow); display: flex; align-items: baseline; gap: 10px;
      border-left: 4px solid var(--hold);
    }
    .kpi.k-up { border-left-color: var(--up); }
    .kpi.k-down { border-left-color: var(--down); }
    .kpi.k-freeze { border-left-color: var(--freeze); }
    .kpi.k-hold { border-left-color: var(--hold); }
    .kpi .lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .kpi .num { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
    .kpi.k-up .num { color: var(--up); }
    .kpi.k-down .num { color: var(--down); }
    .kpi.k-freeze .num { color: var(--freeze); }
    .kpi.k-hold .num { color: var(--hold); }
    .kpi .sub { font-size: 12px; color: var(--faint); font-family: var(--mono); }

    .section-h { margin: 18px 0 10px; }
    .section-h h2 {
      margin: 0; font-family: var(--display); font-size: 20px; letter-spacing: -.02em; font-weight: 800;
    }
    .section-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    /* доска sku */
    .board {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer;
      transition: border-color .12s, transform .12s;
      border-left: 5px solid var(--hold);
    }
    .card.c-up { border-left-color: var(--up); }
    .card.c-down { border-left-color: var(--down); }
    .card.c-freeze { border-left-color: var(--freeze); }
    .card.c-hold { border-left-color: var(--hold); }
    .card.c-manual { border-left-color: var(--manual); }
    .card.c-book { border-left-color: var(--book); }
    .card:hover { transform: translateY(-1px); }
    .card.active { outline: 2px solid var(--up-bg); }

    .card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .card .name { font-weight: 800; font-size: 16px; letter-spacing: -.01em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      font-size: 11px; font-weight: 800; letter-spacing: .05em; padding: 3px 9px;
      border-radius: 999px; text-transform: uppercase; white-space: nowrap;
    }
    .badge.b-up { color: var(--up); background: var(--up-bg); }
    .badge.b-down { color: var(--down); background: var(--down-bg); }
    .badge.b-freeze { color: var(--freeze); background: var(--freeze-bg); }
    .badge.b-hold { color: var(--hold); background: var(--hold-bg); }
    .badge.b-manual { color: var(--manual); background: var(--manual-bg); }
    .badge.b-book { color: var(--book); background: var(--book-bg); }

    .card .price-line {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; margin-bottom: 10px;
    }
    .card .price {
      font-family: var(--display); font-weight: 800; font-size: 26px;
      letter-spacing: -.03em; line-height: 1;
    }
    .card .delta { font-family: var(--mono); font-size: 13px; font-weight: 700; }
    .card .delta.pos { color: var(--up); }
    .card .delta.neg { color: var(--down); }
    .card .delta.flat { color: var(--faint); }

    .card .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px;
      font-family: var(--mono); font-size: 12.5px;
    }
    .card .stats .kv { display: flex; justify-content: space-between; align-items: baseline; }
    .card .stats .k { color: var(--faint); font-size: 11px; }
    .card .stats .v { color: var(--ink); font-weight: 700; }
    .card .stats .v.warn { color: var(--down); }
    .card .stats .v.ok { color: var(--up); }

    /* лента */
    .feed { display: flex; flex-direction: column; gap: 8px; }

    .row {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 16px;
      border-left: 5px solid var(--hold);
      box-shadow: var(--shadow);
    }
    .row.r-up { border-left-color: var(--up); }
    .row.r-down { border-left-color: var(--down); }
    .row.r-freeze { border-left-color: var(--freeze); }
    .row.r-hold { border-left-color: var(--hold); }
    .row.r-manual { border-left-color: var(--manual); }
    .row.r-book { border-left-color: var(--book); }

    /* шапка строки: время, действие, item, цена крупно, дельта */
    .row .head {
      display: grid;
      grid-template-columns: 60px 90px minmax(120px, 180px) minmax(240px, 1fr) 120px;
      gap: 10px 14px; align-items: center;
      padding-bottom: 10px; margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .row .head .t { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 600; }
    .row .head .act {
      font-family: var(--mono); font-weight: 800; font-size: 13px;
      padding: 4px 10px; border-radius: 999px; text-align: center;
      letter-spacing: .04em;
    }
    .row.r-up .head .act { color: var(--up); background: var(--up-bg); }
    .row.r-down .head .act { color: var(--down); background: var(--down-bg); }
    .row.r-freeze .head .act { color: var(--freeze); background: var(--freeze-bg); }
    .row.r-hold .head .act { color: var(--hold); background: var(--hold-bg); }
    .row.r-manual .head .act { color: var(--manual); background: var(--manual-bg); }
    .row.r-book .head .act { color: var(--book); background: var(--book-bg); }

    .row .head .sku { font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .head .prices {
      display: flex; align-items: baseline; gap: 14px;
    }
    .row .head .prices .from { font-family: var(--mono); font-size: 14px; color: var(--faint); }
    .row .head .prices .arrow { color: var(--faint); font-size: 14px; }
    .row .head .prices .to {
      font-family: var(--display); font-weight: 800; font-size: 24px;
      letter-spacing: -.03em; line-height: 1;
    }
    .row .head .chg { font-family: var(--mono); font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
    .row .head .chg.pos { color: var(--up); }
    .row .head .chg.neg { color: var(--down); }
    .row .head .chg.flat { color: var(--faint); }

    /* reason */
    .row .reason {
      font-size: 13.5px; font-weight: 500; color: var(--ink);
      margin-bottom: 10px; padding: 8px 10px;
      background: rgba(16,26,20,.035); border-radius: 8px;
      line-height: 1.35;
    }
    .row .reason .prefix { color: var(--faint); font-family: var(--mono); font-size: 12px; margin-right: 6px; }

    /* цифры — в столбик, 3 колонки */
    .row .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 6px 24px;
      font-family: var(--mono); font-size: 14px;
    }
    .row .stats .kv {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 0;
      border-bottom: 1px dashed var(--line);
    }
    .row .stats .k { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
    .row .stats .v { color: var(--ink); font-weight: 700; font-size: 14.5px; }
    .row .stats .v.warn { color: var(--down); }
    .row .stats .v.ok { color: var(--up); }

    .row .meta-line {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 4px 16px;
      font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    }
    .row .meta-line span b { color: var(--muted); font-weight: 600; }

    .empty {
      text-align: center; color: var(--muted); padding: 40px 12px;
      background: var(--surface-soft); border-radius: var(--radius); border: 1px dashed var(--line);
    }

    @media (max-width: 1100px) {
      .row .head {
        grid-template-columns: 56px 76px 1fr auto;
      }
      .row .head .prices { grid-column: 3; }
      .row .head .chg { grid-column: 4; grid-row: 1 / span 2; }
      .row .stats { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .meta { width: 100%; margin-left: 0; }
      .row .head {
        grid-template-columns: 1fr auto;
      }
      .row .head .t, .row .head .sku { grid-column: 1; }
      .row .head .act { grid-column: 2; grid-row: 1; }
      .row .head .prices { grid-column: 1 / -1; }
      .row .head .chg { grid-column: 1 / -1; text-align: left; grid-row: auto; }
      .row .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">4narek <span>Цены</span></h1>
    <nav class="nav">
      <a href="/pricing/" class="active">Цены</a>
      <a href="/sales/">Продажи</a>
      <a href="/funauth/">FunAuth</a>
      <a href="/fleet/">Баны</a>
    </nav>
    <p class="lede">Цвет рамки = <b>действие системы</b>: UP / DOWN / FREEZE / HOLD / MANUAL / BOOK. Все цифры видны сразу.</p>

    <div class="bar">
      <select id="period" title="Период">
        <option value="1h">Час</option>
        <option value="3h" selected>3 часа</option>
        <option value="6h">6 часов</option>
        <option value="24h">Сутки</option>
        <option value="7d">7 дней</option>
        <option value="all">Всё</option>
      </select>
      <select id="category" title="Категория"><option value="">Все категории</option></select>
      <select id="item" title="Предмет"><option value="">Все предметы</option></select>
      <select id="action" title="Действие">
        <option value="">Все действия</option>
        <option value="UP">UP</option>
        <option value="DOWN">DOWN</option>
        <option value="FREEZE">FREEZE</option>
        <option value="HOLD">HOLD</option>
        <option value="MANUAL">MANUAL</option>
        <option value="BOOK">BOOK</option>
      </select>
      <button type="button" class="primary" id="refresh">Обновить</button>
      <button type="button" class="chip-clear" id="clearItem" hidden>Сбросить предмет</button>
      <span class="meta" id="meta">…</span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="section-h">
      <h2>Доска sku</h2>
      <p>Клик по карточке — фильтр ленты по предмету.</p>
    </div>
    <div class="board" id="board"><div class="empty">Загрузка…</div></div>

    <div class="section-h">
      <h2>Лента решений</h2>
      <p id="feedCap">Новые сверху</p>
    </div>
    <div class="feed" id="feed"><div class="empty">Загрузка…</div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));

    const SHORT = {
      "megasword-1.21": "mega",
      "megasword-яд3-1.21": "яд3",
      "pochti-megasword-1.21": "почти",
      "sword7-1.21": "sword7",
      "sword-sharp5-1.21": "остр5",
      "sword-sharp6-1.21": "остр6",
    };
    const shortName = (id) => SHORT[id] || String(id || "").replace(/-1\.21$/, "");

    const fmt = (n) => {
      if (n == null || Number.isNaN(+n)) return "—";
      const x = Math.round(Number(n));
      if (Math.abs(x) >= 1_000_000) return (x / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
      if (Math.abs(x) >= 10_000) return Math.round(x / 1e3) + "k";
      return x.toLocaleString("ru-RU");
    };
    const fmtFull = (n) => (n == null || Number.isNaN(+n)) ? "—" : Number(n).toLocaleString("ru-RU");
    const fmtPct = (p) => (p == null || Number.isNaN(+p)) ? "" : (p >= 0 ? "+" : "") + Number(p).toFixed(1) + "%";
    const clock = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return esc(iso);
      return d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    };
    const clockShort = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    };

    function actionKind(action) {
      const a = String(action || "").toLowerCase();
      if (a.startsWith("book_peg")) return "book";
      if (a.startsWith("hold_manual") || a.includes("manual")) return "manual";
      if (a.includes("freeze")) return "freeze";
      if (a.includes("price_up") || a.includes("floor_jump")) return "up";
      if (a.includes("price_down") || a.includes("mid_jump")) return "down";
      return "hold";
    }
    function kindLabel(kind) {
      return { up: "UP", down: "DOWN", freeze: "FREEZE", hold: "HOLD", manual: "MANUAL", book: "BOOK" }[kind] || "HOLD";
    }
    function deltaClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "flat"; }
    function signed(n) { return n > 0 ? "+" + fmt(n) : fmt(n); }

    function categoryOf(id) {
      if (id.includes("helmet") || id.startsWith("шлем")) return "helmet";
      if (id.includes("chestplate") || id.startsWith("нагрудник")) return "chestplate";
      if (id.includes("leggings") || id.startsWith("штаны")) return "leggings";
      if (id.includes("boots") || id.startsWith("ботинки")) return "boots";
      if (id.includes("sword") || id.includes("mega") || id.includes("остр") || id.includes("яд") || id.includes("почти")) return "sword";
      if (id.includes("pickaxe") || id.startsWith("кирка")) return "pickaxe";
      return "";
    }

    function salesVal(sales, norm) {
      if (!norm || norm <= 0) return `<span class="v">${sales}</span>`;
      const cls = sales >= norm ? "ok" : "warn";
      return `<span class="v ${cls}">${sales}/${norm}</span>`;
    }
    function tryVal(trySells, sales) {
      const t = trySells ?? 0;
      const s = sales ?? 0;
      if (t === 0) return `<span class="v">0</span>`;
      const warn = t > Math.max(s, 1) * 7;
      return `<span class="v ${warn ? "warn" : ""}">${t}</span>`;
    }

    function renderKPIs(data) {
      const s = data.summary || {};
      const box = (cls, lab, num, sub) =>
        `<div class="kpi ${cls}"><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub || ""}</div></div>`;
      $("kpis").innerHTML = [
        box("k-up", "UP", s.ups ?? 0, "вверх"),
        box("k-down", "DOWN", s.downs ?? 0, "вниз"),
        box("k-freeze", "FREEZE", s.freezes ?? 0, "заморожено"),
        box("k-hold", "HOLD", s.holds ?? 0, "стоим"),
        box("", "Циклов", s.cycles ?? 0, `${s.moves ?? 0} движ.`),
      ].join("");
    }

    function cardHTML(it, activeId) {
      const net = it.net || 0;
      const cls = deltaClass(net);
      const kind = actionKind(it.last_action || "");
      const active = activeId === it.id ? " active" : "";
      return `<article class="card c-${kind}${active}" data-id="${esc(it.id)}" title="${esc(it.id)}">
        <div class="top">
          <div class="name">${esc(shortName(it.id))}</div>
          <span class="badge b-${kind}">${kindLabel(kind)}</span>
        </div>
        <div class="price-line">
          <div class="price">${fmt(it.price || it.close)}</div>
          <div class="delta ${cls}">${net ? `${signed(net)} · ${fmtPct(it.net_pct)}` : "—"}</div>
        </div>
        <div class="stats">
          <div class="kv"><span class="k">sales</span>${salesVal(it.last_sales, it.last_norm)}</div>
          <div class="kv"><span class="k">try</span>${tryVal(it.last_try_sells, it.last_sales)}</div>
          <div class="kv"><span class="k">buy</span><span class="v">${it.last_buys ?? 0}</span></div>
          <div class="kv"><span class="k">AH</span><span class="v">${it.last_on_ah ?? 0}</span></div>
          <div class="kv"><span class="k">INV</span><span class="v">${it.last_inv ?? 0}</span></div>
          <div class="kv"><span class="k">held</span><span class="v">${it.last_held ?? 0}</span></div>
        </div>
      </article>`;
    }

    function rowHTML(d) {
      const kind = actionKind(d.action);
      const delta = d.delta != null ? d.delta : (d.price_after - d.price_before);
      const cls = deltaClass(delta);
      return `<div class="row r-${kind}">
        <div class="head">
          <div class="t">${clockShort(d.ts)}</div>
          <div class="act">${kindLabel(kind)}</div>
          <div class="sku" title="${esc(d.item)}">${esc(shortName(d.item))}</div>
          <div class="prices">
            <span class="from">${fmt(d.price_before)}</span>
            <span class="arrow">→</span>
            <span class="to">${fmt(d.price_after)}</span>
          </div>
          <div class="chg ${cls}">${signed(delta)}</div>
        </div>

        <div class="reason"><span class="prefix">reason:</span>${esc(d.reason_ru || d.action || "—")}</div>

        <div class="stats">
          <div class="kv"><span class="k">sales</span>${salesVal(d.sales, d.normal_sales)}</div>
          <div class="kv"><span class="k">try</span>${tryVal(d.try_sells, d.sales)}</div>
          <div class="kv"><span class="k">buy</span><span class="v">${d.buys ?? 0}</span></div>
          <div class="kv"><span class="k">AH</span><span class="v">${d.on_ah ?? 0}</span></div>
          <div class="kv"><span class="k">INV</span><span class="v">${d.inv ?? 0}</span></div>
          <div class="kv"><span class="k">held</span><span class="v">${d.held ?? 0}</span></div>
          <div class="kv"><span class="k">nac</span><span class="v">${fmt(d.nacenka_after)}</span></div>
          <div class="kv"><span class="k">floor</span><span class="v">${fmt(d.price_floor)}</span></div>
          <div class="kv"><span class="k">step</span><span class="v">${fmt(d.step)}</span></div>
        </div>

        <div class="meta-line">
          <span><b>action</b> ${esc(d.action)}</span>
          <span><b>policy</b> ${esc(d.policy || "—")}</span>
          <span><b>online</b> ${d.players_online || "—"}</span>
          <span><b>id</b> ${d.id}</span>
        </div>
      </div>`;
    }

    async function fillItems(selected) {
      const res = await fetch("/pricing/api/items", { cache: "no-store" });
      const data = await res.json();
      const sel = $("item");
      const keep = selected ?? sel.value;
      sel.innerHTML = `<option value="">Все предметы</option>`;
      (data.items || []).sort().forEach((id) => {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = shortName(id) + " · " + id;
        sel.appendChild(o);
      });
      if (keep) sel.value = keep;

      const cats = new Set();
      for (const id of (data.items || [])) {
        const c = categoryOf(id);
        if (c) cats.add(c);
      }
      const csel = $("category");
      const ckeep = csel.value;
      csel.innerHTML = `<option value="">Все категории</option>`;
      Array.from(cats).sort().forEach((c) => {
        const o = document.createElement("option");
        o.value = c;
        o.textContent = c;
        csel.appendChild(o);
      });
      if (ckeep) csel.value = ckeep;
    }

    function setItemFilter(id) {
      $("item").value = id || "";
      $("clearItem").hidden = !id;
      $("clearItem").classList.toggle("on", !!id);
      load();
    }

    async function load() {
      const period = $("period").value;
      const item = $("item").value;
      const cat = $("category").value;
      const act = $("action").value;
      $("clearItem").hidden = !item;
      $("clearItem").classList.toggle("on", !!item);
      const apiDir = (act === "UP" || act === "DOWN" || act === "HOLD") ? act : "";
      const q = new URLSearchParams({ period, limit: "400" });
      if (item) q.set("item", item);
      if (apiDir) q.set("dir", apiDir);
      $("meta").textContent = "загрузка…";
      try {
        const res = await fetch("/pricing/api/board?" + q.toString(), { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error("bad response");
        let list = data.decisions || [];
        if (cat) list = list.filter((d) => categoryOf(d.item) === cat);
        if (act) list = list.filter((d) => kindLabel(actionKind(d.action)) === act);

        const items = (data.items || []).filter((it) => {
          if (cat && categoryOf(it.id) !== cat) return false;
          return true;
        });

        $("meta").textContent = `${data.policy || "?"} · ${clock(data.updated_at)} · решений ${list.length}`;
        renderKPIs(data);
        $("board").innerHTML = items.length
          ? items.map((it) => cardHTML(it, item)).join("")
          : `<div class="empty">Нет данных</div>`;
        $("feed").innerHTML = list.length
          ? list.map(rowHTML).join("")
          : `<div class="empty">За период нет решений</div>`;
        $("feedCap").textContent = item
          ? `Фильтр: ${shortName(item)} · ${list.length} решений`
          : `Новые сверху · ${list.length} решений`;

        $("board").onclick = (e) => {
          const card = e.target.closest(".card[data-id]");
          if (!card) return;
          const id = card.getAttribute("data-id");
          setItemFilter($("item").value === id ? "" : id);
        };
      } catch (e) {
        $("board").innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
        $("feed").innerHTML = "";
        $("meta").textContent = "ошибка";
      }
    }

    $("refresh").onclick = load;
    $("period").onchange = load;
    $("category").onchange = load;
    $("item").onchange = () => setItemFilter($("item").value);
    $("action").onchange = load;
    $("clearItem").onclick = () => setItemFilter("");
    fillItems().then(load);
    setInterval(load, 20000);
  </script>
</body>
</html>
