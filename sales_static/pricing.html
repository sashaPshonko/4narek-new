<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4narek · Цены</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e6ebe8;
      --bg-deep: #d5ddd8;
      --ink: #101a14;
      --muted: #5a6b62;
      --faint: #84948c;
      --line: rgba(16, 26, 20, 0.1);
      --surface: #ffffff;
      --surface-soft: rgba(255,255,255,.72);
      --up: #0f766e;
      --up-bg: rgba(15,118,110,.12);
      --down: #c2410c;
      --down-bg: rgba(194,65,12,.1);
      --hold: #64748b;
      --hold-bg: rgba(100,116,139,.1);
      --warn: #a16207;
      --warn-bg: rgba(161,98,7,.1);
      --ok: #15803d;
      --shadow: 0 1px 0 rgba(255,255,255,.65) inset, 0 14px 36px rgba(16,26,20,.06);
      --radius: 18px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; color: var(--ink); font-family: var(--font); line-height: 1.4;
      background:
        radial-gradient(900px 420px at 6% -10%, rgba(15,118,110,.16), transparent 55%),
        radial-gradient(700px 380px at 100% 0%, rgba(194,65,12,.08), transparent 50%),
        linear-gradient(180deg, #eef3ef 0%, var(--bg) 42%, var(--bg-deep) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1380px; margin: 0 auto; padding: 28px 20px 80px; }

    .brand {
      font-family: var(--display); font-weight: 800; margin: 0 0 6px;
      font-size: clamp(34px, 5vw, 56px); letter-spacing: -.04em; line-height: .95;
    }
    .brand span { color: var(--up); }
    .lede { margin: 0 0 14px; color: var(--muted); max-width: 52em; font-weight: 500; }

    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .nav a {
      text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    }
    .nav a.active, .nav a:hover { color: var(--ink); background: var(--up-bg); border-color: rgba(15,118,110,.28); }

    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px;
      padding: 10px 12px; border-radius: 14px; background: var(--surface-soft);
      border: 1px solid var(--line); position: sticky; top: 8px; z-index: 20;
      backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(16,26,20,.04);
    }
    .bar select, .bar button {
      font: inherit; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; background: #fff; color: var(--ink);
    }
    .bar button { cursor: pointer; font-weight: 700; }
    .bar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip-clear {
      border: 1px dashed var(--line); background: transparent; border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .chip-clear.on { color: var(--down); border-color: rgba(194,65,12,.35); background: var(--down-bg); }
    .meta { margin-left: auto; color: var(--faint); font-size: 12px; font-family: var(--mono); }

    .kpis {
      display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-bottom: 18px;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow); min-height: 92px;
    }
    .kpi .lab {
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .kpi .num {
      font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1;
    }
    .kpi .sub { margin-top: 6px; font-size: 12px; color: var(--faint); font-family: var(--mono); }
    .kpi.up .num { color: var(--up); }
    .kpi.down .num { color: var(--down); }
    .kpi.hold .num { color: var(--hold); }

    .section-h {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 8px 0 12px;
    }
    .section-h h2 {
      margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: -.02em; font-weight: 800;
    }
    .section-h p { margin: 0; color: var(--muted); font-size: 13px; }

    .board {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px; margin-bottom: 28px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 14px 12px; box-shadow: var(--shadow); cursor: pointer;
      transition: border-color .15s, transform .15s; position: relative; overflow: hidden;
    }
    .card:hover { border-color: rgba(15,118,110,.35); transform: translateY(-1px); }
    .card.active { border-color: rgba(15,118,110,.55); outline: 2px solid var(--up-bg); }
    .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .card .name {
      font-weight: 800; font-size: 15px; letter-spacing: -.02em; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .badge {
      font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 3px 8px;
      border-radius: 999px; text-transform: uppercase;
    }
    .badge.UP { color: var(--up); background: var(--up-bg); }
    .badge.DOWN { color: var(--down); background: var(--down-bg); }
    .badge.HOLD { color: var(--hold); background: var(--hold-bg); }
    .card .price {
      font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -.03em;
      line-height: 1; margin-bottom: 4px;
    }
    .card .delta {
      font-family: var(--mono); font-size: 13px; font-weight: 600; margin-bottom: 10px;
    }
    .card .delta.pos { color: var(--up); }
    .card .delta.neg { color: var(--down); }
    .card .delta.flat { color: var(--faint); }
    .spark { width: 100%; height: 44px; display: block; margin-bottom: 10px; }
    .card .foot {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
      font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px;
    }
    .card .foot b { color: var(--ink); font-weight: 700; }
    .card .why {
      grid-column: 1 / -1; font-size: 12px; color: var(--ink); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .feed { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: grid;
      grid-template-columns: 72px 100px 68px 88px minmax(140px, 1fr) minmax(180px, 1.2fr) auto;
      gap: 8px 10px; align-items: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 10px 12px; box-shadow: 0 6px 18px rgba(16,26,20,.03);
      border-left: 4px solid var(--hold);
    }
    .row.UP { border-left-color: var(--up); }
    .row.DOWN { border-left-color: var(--down); }
    .row.HOLD { border-left-color: var(--hold); }
    .row .t { font-family: var(--mono); font-size: 12px; color: var(--faint); }
    .row .sku { font-weight: 800; font-size: 13px; letter-spacing: -.01em; }
    .row .sku button { all: unset; cursor: pointer; color: inherit; }
    .row .sku button:hover { color: var(--up); }
    .row .chg {
      font-family: var(--mono); font-weight: 700; font-size: 13px; white-space: nowrap;
    }
    .row .chg.pos { color: var(--up); }
    .row .chg.neg { color: var(--down); }
    .row .chg.flat { color: var(--faint); }
    .row .path {
      font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .row .reason { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .row .stats {
      font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right;
      white-space: nowrap;
    }
    .row details { grid-column: 1 / -1; }
    .row summary {
      cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600;
      list-style: none; width: fit-content;
    }
    .row summary::-webkit-details-marker { display: none; }
    .row .detail {
      margin-top: 8px; padding: 10px; border-radius: 10px; background: rgba(16,26,20,.035);
      font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap;
      word-break: break-word; line-height: 1.45;
    }
    .row .grid {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 8px;
      font-size: 12px;
    }
    .row .grid .cell {
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    .row .grid .cell .l { color: var(--faint); font-size: 11px; margin-bottom: 2px; }
    .row .grid .cell .v { font-weight: 700; font-family: var(--mono); font-size: 12px; }

    .empty {
      text-align: center; color: var(--muted); padding: 48px 12px;
      background: var(--surface-soft); border-radius: var(--radius); border: 1px dashed var(--line);
    }

    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, 1fr); }
      .row {
        grid-template-columns: 64px 1fr auto;
        gap: 6px 8px;
      }
      .row .t { grid-row: span 3; align-self: start; padding-top: 2px; }
      .row .sku { font-size: 14px; }
      .row .badge { justify-self: end; }
      .row .chg { grid-column: 2; }
      .row .path { grid-column: 2 / -1; }
      .row .reason { grid-column: 2 / -1; }
      .row .stats { grid-column: 2 / -1; text-align: left; }
    }
    @media (max-width: 720px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .meta { width: 100%; margin-left: 0; }
      .row .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">4narek <span>Цены</span></h1>
    <nav class="nav" aria-label="Разделы">
      <a href="/pricing/" class="active">Цены</a>
      <a href="/sales/">Продажи</a>
      <a href="/funauth/">FunAuth</a>
      <a href="/fleet/">Баны</a>
    </nav>
    <p class="lede">Живая доска: куда уехала цена за период, кто сильнее всех прыгнул, и лента решений — сначала смысл глазами, детали по клику.</p>

    <div class="bar">
      <select id="period" title="Период">
        <option value="1h">Час</option>
        <option value="3h" selected>3 часа</option>
        <option value="6h">6 часов</option>
        <option value="24h">Сутки</option>
        <option value="7d">7 дней</option>
        <option value="all">Всё</option>
      </select>
      <select id="item" title="Предмет"><option value="">Все предметы</option></select>
      <select id="dir" title="Направление">
        <option value="">Все решения</option>
        <option value="UP">Только ↑</option>
        <option value="DOWN">Только ↓</option>
        <option value="HOLD">Только hold</option>
      </select>
      <button type="button" class="primary" id="refresh">Обновить</button>
      <button type="button" class="chip-clear" id="clearItem" hidden>Сбросить предмет</button>
      <span class="meta" id="meta">…</span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="section-h">
      <h2>Доска sku</h2>
      <p>Клик по карточке — фильтр ленты. Цвет дельты = за выбранный период.</p>
    </div>
    <div class="board" id="board"><div class="empty">Загрузка…</div></div>

    <div class="section-h">
      <h2>Лента решений</h2>
      <p id="feedCap">Новые сверху</p>
    </div>
    <div class="feed" id="feed"><div class="empty">Загрузка…</div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));

    const SHORT = {
      "megasword-1.21": "mega",
      "megasword-яд3-1.21": "яд3",
      "pochti-megasword-1.21": "почти",
      "sword7-1.21": "sword7",
      "sword-sharp5-1.21": "остр5",
      "sword-sharp6-1.21": "остр6",
      "sword-sharp5-loot5-1.21": "остр5+loot",
      "sword-sharp6-loot5-1.21": "остр6+loot",
    };
    const shortName = (id) => SHORT[id] || String(id || "").replace(/-1\.21$/, "");

    const fmt = (n) => {
      if (n == null || Number.isNaN(+n)) return "—";
      const x = Math.round(Number(n));
      if (Math.abs(x) >= 1_000_000) return (x / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
      if (Math.abs(x) >= 10_000) return Math.round(x / 1e3) + "k";
      return x.toLocaleString("ru-RU");
    };
    const fmtFull = (n) => (n == null || Number.isNaN(+n)) ? "—" : Number(n).toLocaleString("ru-RU");
    const fmtPct = (p) => {
      if (p == null || Number.isNaN(+p)) return "";
      const s = (p >= 0 ? "+" : "") + Number(p).toFixed(1) + "%";
      return s;
    };
    const clock = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return esc(iso);
      return d.toLocaleString("ru-RU", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
      });
    };
    const clockShort = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    };

    function sparkSVG(points, dirHint) {
      const xs = (points || []).filter((n) => Number.isFinite(+n) && +n > 0).map(Number);
      if (xs.length < 2) {
        return `<svg class="spark" viewBox="0 0 120 44" preserveAspectRatio="none"><line x1="0" y1="22" x2="120" y2="22" stroke="rgba(16,26,20,.12)" stroke-width="2"/></svg>`;
      }
      const min = Math.min(...xs), max = Math.max(...xs);
      const span = Math.max(1, max - min);
      const w = 120, h = 44, pad = 3;
      const coords = xs.map((v, i) => {
        const x = pad + (i / (xs.length - 1)) * (w - pad * 2);
        const y = pad + (1 - (v - min) / span) * (h - pad * 2);
        return [x, y];
      });
      const line = coords.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
      const area = line + ` L${coords[coords.length-1][0].toFixed(1)} ${h} L${coords[0][0].toFixed(1)} ${h} Z`;
      const last = xs[xs.length - 1], first = xs[0];
      const stroke = last > first ? "var(--up)" : last < first ? "var(--down)" : "var(--hold)";
      const fill = last > first ? "rgba(15,118,110,.14)" : last < first ? "rgba(194,65,12,.12)" : "rgba(100,116,139,.1)";
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <path d="${area}" fill="${fill}"></path>
        <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>`;
    }

    function deltaClass(n) {
      if (n > 0) return "pos";
      if (n < 0) return "neg";
      return "flat";
    }
    function signed(n) {
      if (n > 0) return "+" + fmt(n);
      return fmt(n);
    }

    function renderKPIs(data) {
      const s = data.summary || {};
      const up = data.top_up;
      const down = data.top_down;
      const box = (cls, lab, num, sub) =>
        `<div class="kpi ${cls}"><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub || ""}</div></div>`;
      $("kpis").innerHTML = [
        box("up", "Подняли", s.ups ?? 0, "решений ↑"),
        box("down", "Опустили", s.downs ?? 0, "решений ↓"),
        box("hold", "Hold", s.holds ?? 0, "без сдвига"),
        box("", "Циклов", s.cycles ?? 0, `${s.moves ?? 0} с движением`),
        box(
          up && (!down || Math.abs(up.net_pct) >= Math.abs(down.net_pct)) ? "up" : (down ? "down" : ""),
          "Сильнее всех",
          up || down
            ? shortName((up && (!down || Math.abs(up.net_pct) >= Math.abs(down.net_pct))) ? up.id : down.id)
            : "—",
          up || down
            ? (() => {
                const m = (up && (!down || Math.abs(up.net_pct) >= Math.abs(down.net_pct))) ? up : down;
                return `${signed(m.net)} · ${fmtPct(m.net_pct)}`;
              })()
            : "нет сдвигов"
        ),
      ].join("");
    }

    function cardHTML(it, activeId) {
      const net = it.net || 0;
      const cls = deltaClass(net);
      const active = activeId === it.id ? " active" : "";
      const last = it.last_dir || "HOLD";
      const salesBit = it.last_norm
        ? `продажи <b>${it.last_sales}/${it.last_norm}</b>`
        : `продажи <b>${it.last_sales ?? "—"}</b>`;
      return `<article class="card${active}" data-id="${esc(it.id)}" title="${esc(it.id)}">
        <div class="top">
          <div class="name">${esc(shortName(it.id))}</div>
          <span class="badge ${esc(last)}">${esc(last)}</span>
        </div>
        <div class="price">${fmt(it.price || it.close)}</div>
        <div class="delta ${cls}">${net ? `${signed(net)} · ${fmtPct(it.net_pct)}` : "без сдвига за период"}</div>
        ${sparkSVG(it.spark, last)}
        <div class="foot">
          <div>АХ/инв <b>${it.last_on_ah ?? 0}/${it.last_inv ?? 0}</b></div>
          <div>${salesBit}</div>
          <div class="why">${esc(it.last_reason || "ещё нет решения")}</div>
        </div>
      </article>`;
    }

    function rowHTML(d) {
      const dir = d.dir || "HOLD";
      const delta = d.delta != null ? d.delta : (d.price_after - d.price_before);
      const cls = deltaClass(delta);
      const salesWarn = d.normal_sales > 0 && d.sales < d.normal_sales;
      return `<article class="row ${esc(dir)}">
        <div class="t">${clockShort(d.ts)}</div>
        <div class="sku"><button type="button" data-pick="${esc(d.item)}">${esc(shortName(d.item))}</button></div>
        <span class="badge ${esc(dir)}">${esc(dir)}</span>
        <div class="chg ${cls}">${signed(delta)}</div>
        <div class="path">${fmt(d.price_before)} → ${fmt(d.price_after)}</div>
        <div class="reason">${esc(d.reason_ru || d.action || "—")}</div>
        <div class="stats">
  ${salesWarn ? "sales↓ " : ""}
  ${d.sales}/${d.normal_sales} · buy ${d.buys} ·
  stock ${Number(d.on_ah || 0) + Number(d.inv || 0)}
  [${d.on_ah || 0} AH + ${d.inv || 0} INV]
</div>
        <details>
          <summary>детали · ${clock(d.ts)}</summary>
          <div class="grid">
            <div class="cell"><div class="l">цена</div><div class="v">${fmtFull(d.price_before)} → ${fmtFull(d.price_after)}</div></div>
            <div class="cell"><div class="l">наценка</div><div class="v">${fmtFull(d.nacenka_before)} → ${fmtFull(d.nacenka_after)}</div></div>
            <div class="cell"><div class="l">АХ / инв / held</div><div class="v">${d.on_ah} / ${d.inv} / ${d.held}</div></div>
            <div class="cell"><div class="l">share / free / need</div><div class="v">${d.share} / ${d.free} / ${d.need}</div></div>
            <div class="cell"><div class="l">пол · step</div><div class="v">${fmtFull(d.price_floor)} · ${fmtFull(d.step)}</div></div>
            <div class="cell"><div class="l">action</div><div class="v">${esc(d.action)}</div></div>
            <div class="cell"><div class="l">policy</div><div class="v">${esc(d.policy || "—")}</div></div>
            <div class="cell"><div class="l">online</div><div class="v">${d.players_online || "—"}</div></div>
          </div>
          ${d.notes ? `<div class="detail">${esc(d.notes)}</div>` : ""}
        </details>
      </article>`;
    }

    async function fillItems(selected) {
      const res = await fetch("/pricing/api/items", { cache: "no-store" });
      const data = await res.json();
      const sel = $("item");
      const keep = selected ?? sel.value;
      sel.innerHTML = `<option value="">Все предметы</option>`;
      (data.items || []).sort().forEach((id) => {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = shortName(id) + " · " + id;
        sel.appendChild(o);
      });
      if (keep) sel.value = keep;
    }

    function setItemFilter(id) {
      $("item").value = id || "";
      $("clearItem").hidden = !id;
      $("clearItem").classList.toggle("on", !!id);
      load();
    }

    async function load() {
      const period = $("period").value;
      const item = $("item").value;
      const dir = $("dir").value;
      $("clearItem").hidden = !item;
      $("clearItem").classList.toggle("on", !!item);
      const q = new URLSearchParams({ period, limit: "160" });
      if (item) q.set("item", item);
      if (dir) q.set("dir", dir);
      $("meta").textContent = "загрузка…";
      try {
        const res = await fetch("/pricing/api/board?" + q.toString(), { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error("bad response");
        const list = data.decisions || [];
        const items = data.items || [];
        $("meta").textContent = `${data.policy || "?"} · ${clock(data.updated_at)} · лента ${list.length}`;
        renderKPIs(data);
        $("board").innerHTML = items.length
          ? items.map((it) => cardHTML(it, item)).join("")
          : `<div class="empty">За период нет движения по sku</div>`;
        $("feedCap").textContent = item
          ? `Фильтр: ${shortName(item)} · новые сверху`
          : "Новые сверху";
        $("feed").innerHTML = list.length
          ? list.map(rowHTML).join("")
          : `<div class="empty">За период нет решений</div>`;

        $("board").onclick = (e) => {
          const card = e.target.closest(".card[data-id]");
          if (!card) return;
          const id = card.getAttribute("data-id");
          setItemFilter($("item").value === id ? "" : id);
        };
        $("feed").onclick = (e) => {
          const btn = e.target.closest("button[data-pick]");
          if (!btn) return;
          setItemFilter(btn.getAttribute("data-pick"));
        };
      } catch (e) {
        $("board").innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
        $("feed").innerHTML = "";
        $("meta").textContent = "ошибка";
      }
    }

    $("refresh").onclick = load;
    $("period").onchange = load;
    $("item").onchange = () => setItemFilter($("item").value);
    $("dir").onchange = load;
    $("clearItem").onclick = () => setItemFilter("");
    fillItems().then(load);
    setInterval(load, 20000);
  </script>
</body>
</html>
