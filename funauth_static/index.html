<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FunAuth</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --bg-glow: radial-gradient(1200px 600px at 10% -10%, #e8eef8 0%, transparent 55%),
                 radial-gradient(900px 500px at 100% 0%, #f0ebe4 0%, transparent 50%);
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #ffffff;
      --line: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --accent-press: #0077ed;
      --ok: #1f8f4e;
      --warn: #b86e00;
      --bad: #d70015;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
      --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
              "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      background-image: var(--bg-glow);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    header {
      margin-bottom: 28px;
    }
    header h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 400;
      max-width: 36em;
    }
    #health {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      padding: 8px 12px;
      border-radius: 980px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    #health::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(31, 143, 78, 0.15);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding-top: 28px; }
      header h1 { font-size: 28px; }
    }
    .card {
      background: var(--surface);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      box-shadow: var(--shadow);
    }
    .card.wide { grid-column: 1 / -1; }
    .card h2 {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin: 0 0 6px;
    }
    label + input { margin-bottom: 14px; }
    .hint {
      display: block;
      margin: -8px 0 14px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.9;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      border-color: rgba(0, 113, 227, 0.55);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 980px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }
    button:hover { background: var(--accent-press); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.ghost:hover { background: rgba(0,0,0,0.03); }
    button.danger {
      background: transparent;
      color: var(--bad);
      border: 1px solid rgba(215, 0, 21, 0.25);
      padding: 6px 12px;
      font-size: 13px;
    }
    button.danger:hover { background: rgba(215, 0, 21, 0.06); }
    .msg {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 1.2em;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--bad); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.ready { background: rgba(31, 143, 78, 0.12); color: var(--ok); }
    .badge.full { background: rgba(184, 110, 0, 0.12); color: var(--warn); }
    .badge.off { background: rgba(0, 0, 0, 0.06); color: var(--muted); }
    .empty {
      color: var(--muted);
      font-size: 14px;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>FunAuth</h1>
      <p>Пул Telegram-аккаунтов для привязки Minecraft через @FunAuthBot. Трафик идёт через Reality SOCKS на :1080.</p>
      <div id="health">Загрузка…</div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Войти в Telegram</h2>
        <label for="phone">Телефон</label>
        <input id="phone" type="tel" placeholder="+79001234567" autocomplete="tel" />
        <div class="row">
          <button id="btnStart" type="button">Отправить код</button>
        </div>

        <label for="code" style="margin-top:18px">Код из Telegram</label>
        <input id="code" type="text" placeholder="12345" inputmode="numeric" autocomplete="one-time-code" />
        <div class="row">
          <button id="btnCode" type="button" disabled>Подтвердить</button>
        </div>

        <label for="tgPassword" style="margin-top:18px">Пароль Telegram (если включён)</label>
        <span class="hint">Только если в аккаунте есть двухэтапная проверка. Иначе оставь пустым.</span>
        <input id="tgPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
        <div class="row">
          <button id="btnPassword" type="button" disabled>Войти с паролем</button>
        </div>
        <div id="loginMsg" class="msg"></div>
      </section>

      <section class="card">
        <h2>Привязка Minecraft</h2>
        <label for="nick">Ник</label>
        <input id="nick" type="text" placeholder="Player123" autocomplete="off" />
        <label for="mcPassword">Пароль аккаунта</label>
        <input id="mcPassword" type="password" placeholder="пароль" autocomplete="off" />
        <div class="row">
          <button id="btnBind" type="button">Привязать</button>
          <button id="btnRefresh" class="ghost" type="button">Обновить</button>
        </div>
        <div id="bindMsg" class="msg"></div>
        <div id="queueInfo" class="msg"></div>
      </section>

      <section class="card wide">
        <h2>Аккаунты</h2>
        <div id="accounts"><p class="empty">Пока пусто</p></div>
      </section>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentPhone = '';
    const API = '/funauth/api';

    function setMsg(el, text, kind) {
      el.textContent = text || '';
      el.className = 'msg' + (kind ? ' ' + kind : '');
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && !data.error) data.error = res.statusText;
      data._status = res.status;
      return data;
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    function badge(a) {
      if (a.full) return '<span class="badge full">полный</span>';
      if (a.ready) return '<span class="badge ready">готов</span>';
      return '<span class="badge off">офлайн</span>';
    }

    async function refresh() {
      try {
        const [health, accounts, queue] = await Promise.all([
          api('/health'),
          api('/accounts'),
          api('/queue'),
        ]);
        $('health').textContent =
          `${health.accounts ?? 0} акк. · ${health.ready ?? 0} готовых · очередь ${health.queue ?? 0}`;

        if (!Array.isArray(accounts) || !accounts.length) {
          $('accounts').innerHTML = '<p class="empty">Пока пусто — добавь телефон слева</p>';
        } else {
          $('accounts').innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Телефон</th>
                  <th>Username</th>
                  <th>Статус</th>
                  <th>Start</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${accounts.map((a) => `
                  <tr>
                    <td>${esc(a.phone)}</td>
                    <td>${esc(a.username ? '@' + a.username : '—')}</td>
                    <td>${badge(a)}</td>
                    <td>${a.started ? 'да' : 'нет'}</td>
                    <td><button class="danger" data-del="${esc(a.id)}" type="button">Удалить</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`;
          $('accounts').querySelectorAll('[data-del]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              if (!confirm('Удалить аккаунт?')) return;
              await api('/accounts/' + btn.dataset.del, { method: 'DELETE' });
              refresh();
            });
          });
        }

        const q = queue || {};
        const lines = [];
        if (q.current) lines.push('Сейчас: ' + q.current.nick);
        if (q.pending?.length) lines.push('Ждут: ' + q.pending.map((j) => j.nick).join(', '));
        $('queueInfo').textContent = lines.length ? lines.join('\n') : 'Очередь пуста';
      } catch (e) {
        $('health').textContent = 'Сервер недоступен';
      }
    }

    $('btnStart').onclick = async () => {
      const phone = $('phone').value.trim();
      setMsg($('loginMsg'), 'Отправка кода…');
      $('btnStart').disabled = true;
      try {
        const r = await api('/login/start', {
          method: 'POST',
          body: JSON.stringify({ phone }),
        });
        if (r.error && !r.ok) throw new Error(r.error);
        currentPhone = r.phone || phone;
        $('btnCode').disabled = false;
        setMsg($('loginMsg'), 'Код отправлен на ' + currentPhone, 'ok');
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      } finally {
        $('btnStart').disabled = false;
      }
    };

    $('btnCode').onclick = async () => {
      const phone = currentPhone || $('phone').value.trim();
      const code = $('code').value.trim();
      setMsg($('loginMsg'), 'Проверка кода…');
      try {
        const r = await api('/login/code', {
          method: 'POST',
          body: JSON.stringify({ phone, code }),
        });
        if (r.error && r.ok === false) throw new Error(r.error);
        if (r.needPassword) {
          $('btnPassword').disabled = false;
          setMsg($('loginMsg'), 'Нужен пароль двухэтапной проверки Telegram', 'ok');
          return;
        }
        setMsg($('loginMsg'), 'Готово: ' + (r.phone || phone), 'ok');
        $('btnCode').disabled = true;
        $('btnPassword').disabled = true;
        refresh();
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      }
    };

    $('btnPassword').onclick = async () => {
      const phone = currentPhone || $('phone').value.trim();
      const password = $('tgPassword').value;
      setMsg($('loginMsg'), 'Проверка пароля…');
      try {
        const r = await api('/login/password', {
          method: 'POST',
          body: JSON.stringify({ phone, password }),
        });
        if (r.error && r.ok === false) throw new Error(r.error);
        setMsg($('loginMsg'), 'Готово: ' + (r.phone || phone), 'ok');
        $('btnCode').disabled = true;
        $('btnPassword').disabled = true;
        refresh();
      } catch (e) {
        setMsg($('loginMsg'), String(e.message || e), 'err');
      }
    };

    $('btnBind').onclick = async () => {
      const nick = $('nick').value.trim();
      const password = $('mcPassword').value;
      setMsg($('bindMsg'), 'В очередь…');
      $('btnBind').disabled = true;
      try {
        const r = await api('/bind', {
          method: 'POST',
          body: JSON.stringify({ nick, password }),
        });
        if (r.queued || r._status === 202) {
          setMsg($('bindMsg'), `В очереди: ${nick}`, 'ok');
        } else if (r.ok) {
          setMsg(
            $('bindMsg'),
            `OK · ${r.nick}` + (r.tgPhone ? ` · ${r.tgPhone}` : ''),
            'ok',
          );
        } else {
          setMsg($('bindMsg'), `Ошибка: ${r.error || 'unknown'}`, 'err');
        }
        refresh();
      } catch (e) {
        setMsg($('bindMsg'), String(e.message || e), 'err');
      } finally {
        $('btnBind').disabled = false;
      }
    };

    $('btnRefresh').onclick = () => refresh();
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
